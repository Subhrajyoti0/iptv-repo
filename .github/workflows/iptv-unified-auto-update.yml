name: IPTV Unified Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-unified-main
  cancel-in-progress: false

jobs:
  update-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run full build pipeline
        run: npm run build

      - name: Validate Zee5 XMLTV
        run: |
          if [ ! -s output/zee5.xml ]; then
            echo "Zee5 XML missing or empty"
            exit 1
          fi

          if ! grep -q "<programme" output/zee5.xml; then
            echo "Zee5 XML has no programme entries"
            exit 1
          fi

      - name: Validate unified output
        run: |
          if [ ! -s output/unified_channels.json ]; then
            echo "Unified channel output missing or empty"
            exit 1
          fi

      - name: Remove runtime files
        run: |
          rm -f output/zee5_progress.json

      - name: Commit changes
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"

          git add output/zee5.xml \
                  output/zee5_raw_epg.json \
                  output/zee5_normalized_epg.json \
                  output/jio_channels.json \
                  output/jio_epg.xml \
                  output/unified_channels.json \
                  output/review.json \
                  patcher/patch_log.json \
                  patcher/review.json \
                  patcher/channel_rename_history.json

          git rm -f --ignore-unmatch output/zee5_progress.json || true

          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi

          git commit -m "Auto-update unified IPTV pipeline (6h)"

      - name: Ensure clean working tree before push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree still dirty before push"
            git status --porcelain
            exit 1
          fi

      - name: Rebase and push safely
        run: |
          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git pull --rebase --autostash origin main && git push && exit 0

            echo "Push failed, retrying after backoff..."
            sleep $((attempt * 10))
          done

          echo "Failed to push after 3 attempts"
          exit 1
