name: IPTV Unified Auto Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-unified-main
  cancel-in-progress: false

jobs:
  update-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run full Kodi master XMLTV build
        env:
          JIO_START_OFFSET: "0"
          JIO_END_OFFSET: "5"
          JIO_ALLOW_EMPTY: "1"
        run: npm run build

      - name: Validate Kodi master XMLTV
        run: |
          if [ ! -s output/kodi_master.xml ]; then
            echo "Kodi master XMLTV missing or empty"
            exit 1
          fi

          if ! grep -q "<channel" output/kodi_master.xml; then
            echo "Kodi master XMLTV has no channel entries"
            exit 1
          fi

      - name: Show output summary
        run: |
          echo "Generated output files:"
          ls -lh output || true

          echo ""
          echo "Kodi master channel count:"
          grep -c "<channel" output/kodi_master.xml || true

          echo ""
          echo "Kodi master programme count:"
          grep -c "<programme" output/kodi_master.xml || true

          echo ""
          echo "Kodi master summary:"
          cat output/kodi_master_summary.json 2>/dev/null || true

      - name: Remove runtime files
        run: |
          rm -f output/zee5_progress.json

      - name: Commit changes
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"

          git add output/zee5.xml \
                  output/zee5_raw_epg.json \
                  output/zee5_normalized_epg.json \
                  output/iptv_org_in.m3u \
                  output/in_parsed.json \
                  output/jio_channels.json \
                  output/jio_epg.json \
                  output/jio_epg.jsonl \
                  output/jio_epg.xml \
                  output/jio_epg_stats.json \
                  output/jio_iptv_matches.json \
                  output/jio_iptv_review.json \
                  output/kodi_master.xml \
                  output/kodi_master_summary.json \
                  docs/kodi_master.xml \
                  patcher/patch_log.json \
                  patcher/review.json \
                  patcher/channel_rename_history.json

          git rm -f --ignore-unmatch output/zee5_progress.json || true

          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi

          git commit -m "Auto-update Kodi master XMLTV pipeline (6h)"

      - name: Rebase and push safely
        run: |
          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git pull --rebase --autostash origin main && git push && exit 0

            echo "Push failed, retrying after backoff..."
            sleep $((attempt * 10))
          done

          echo "Failed to push after 3 attempts"
          exit 1
