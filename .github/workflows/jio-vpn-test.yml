name: Test JioTV with OpenVPN CloudConnexa

on:
  workflow_dispatch:
  push:
    branches:
      - test/jio-vpn-github-runner

permissions:
  contents: read

jobs:
  test-jio-openvpn:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn curl iproute2 dnsutils

      - name: Write OpenVPN config from secret
        env:
          VPN_CONFIG: ${{ secrets.FREE_VPN_CONFIG }}
        run: |
          if [ -z "$VPN_CONFIG" ]; then
            echo "FREE_VPN_CONFIG secret is missing"
            exit 1
          fi

          printf '%s\n' "$VPN_CONFIG" > cloudconnexa.ovpn
          sed -i 's/\r$//' cloudconnexa.ovpn
          chmod 600 cloudconnexa.ovpn

          echo "VPN config loaded."
          grep -E "^(client|dev|proto|remote|setenv)" cloudconnexa.ovpn || true

      - name: Prepare split route for JioTV API
        id: jioip
        run: |
          JIO_HOST="jiotv.data.cdn.jio.com"
          JIO_IP="$(getent ahostsv4 "$JIO_HOST" | awk '{print $1; exit}')"

          if [ -z "$JIO_IP" ]; then
            echo "Could not resolve $JIO_HOST"
            exit 1
          fi

          echo "Jio host: $JIO_HOST"
          echo "Jio IP: $JIO_IP"

          echo "$JIO_IP $JIO_HOST" | sudo tee -a /etc/hosts
          echo "jio_ip=$JIO_IP" >> "$GITHUB_OUTPUT"

          # Remove dangerous full-tunnel directives if present
          sed -i '/^redirect-gateway/d' cloudconnexa.ovpn
          sed -i '/^route-metric/d' cloudconnexa.ovpn

          # Prevent VPN from taking over the whole GitHub runner
          echo "" >> cloudconnexa.ovpn
          echo "route-nopull" >> cloudconnexa.ovpn
          echo "pull-filter ignore redirect-gateway" >> cloudconnexa.ovpn

          # Route only JioTV API IP via VPN
          echo "route $JIO_IP 255.255.255.255 vpn_gateway" >> cloudconnexa.ovpn

          echo "Final route-related config:"
          grep -E "^(remote|proto|dev|route-nopull|pull-filter|route |redirect-gateway|route-metric)" cloudconnexa.ovpn || true

      - name: Start OpenVPN
        run: |
          sudo openvpn \
            --config cloudconnexa.ovpn \
            --daemon \
            --log openvpn.log \
            --writepid openvpn.pid

          echo "Waiting for VPN tunnel..."

          for i in $(seq 1 90); do
            if sudo grep -q "Initialization Sequence Completed" openvpn.log; then
              echo "VPN connected."
              break
            fi

            if sudo grep -qi "AUTH_FAILED\|TLS Error\|Exiting due to fatal error" openvpn.log; then
              echo "VPN failed."
              sudo cat openvpn.log
              exit 1
            fi

            sleep 1
          done

          echo "OpenVPN log tail:"
          sudo tail -n 120 openvpn.log || true

          if ! sudo grep -q "Initialization Sequence Completed" openvpn.log; then
            echo "VPN did not complete initialization."
            exit 1
          fi

      - name: Verify split route
        run: |
          echo "Route to JioTV API IP:"
          ip route get "${{ steps.jioip.outputs.jio_ip }}" || true

          echo ""
          echo "Default route:"
          ip route | head -20 || true

          echo ""
          echo "Public IP may still show GitHub IP because only JioTV IP is routed via VPN:"
          curl -s https://ifconfig.me || true
          echo ""

      - name: Test Jio channel API
        run: |
          cat > test-jio-api.mjs <<'NODE'
          const url = "https://jiotv.data.cdn.jio.com/apis/v3.0/getMobileChannelList/get/?os=android&devicetype=phone&usertype=tvYR7NSNn7rymo3F";

          const response = await fetch(url, {
            headers: {
              "user-agent": "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36",
              "accept": "application/json,text/plain,*/*"
            }
          });

          console.log("status:", response.status);

          const text = await response.text();
          console.log(text.slice(0, 700));

          if (!response.ok) {
            process.exit(1);
          }
          NODE

          node test-jio-api.mjs

      - name: Run Jio generator limited test
        env:
          JIO_LIMIT: "20"
          JIO_START_OFFSET: "0"
          JIO_END_OFFSET: "0"
          JIO_ALLOW_EMPTY: "0"
          JIO_STRICT: "1"
        run: npm run jio

      - name: Show generated output summary
        if: always()
        run: |
          ls -lh output || true
          cat output/jio_epg.json 2>/dev/null || true
          grep -c "<programme" output/jio_epg.xml 2>/dev/null || true

      - name: Upload VPN test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jio-openvpn-cloudconnexa-test
          path: |
            openvpn.log
            output/jio_channels.json
            output/jio_epg.json
            output/jio_epg.jsonl
            output/jio_epg.xml
            output/jio_epg_stats.json
          if-no-files-found: ignore
