name: Test JioTV with OpenVPN CloudConnexa

on:
  workflow_dispatch:
  push:
    branches:
      - test/jio-vpn-github-runner

permissions:
  contents: read

jobs:
  test-jio-openvpn:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn curl iproute2

      - name: Write OpenVPN config from secret
        env:
          VPN_CONFIG: ${{ secrets.FREE_VPN_CONFIG }}
        run: |
          if [ -z "$VPN_CONFIG" ]; then
            echo "FREE_VPN_CONFIG secret is missing"
            exit 1
          fi

          printf '%s\n' "$VPN_CONFIG" > cloudconnexa.ovpn
          sed -i 's/\r$//' cloudconnexa.ovpn
          chmod 600 cloudconnexa.ovpn

          echo "VPN config loaded."
          grep -E "^(client|dev|proto|remote|redirect-gateway|route)" cloudconnexa.ovpn || true

      - name: Write VPN auth file if username/password are provided
        env:
          VPN_USER: ${{ secrets.FREE_VPN_USERNAME }}
          VPN_PASS: ${{ secrets.FREE_VPN_PASSWORD }}
        run: |
          if [ -n "$VPN_USER" ] && [ -n "$VPN_PASS" ]; then
            printf "%s\n%s\n" "$VPN_USER" "$VPN_PASS" > vpn-auth.txt
            chmod 600 vpn-auth.txt

            if grep -q "^auth-user-pass" cloudconnexa.ovpn; then
              sed -i 's|^auth-user-pass.*|auth-user-pass vpn-auth.txt|' cloudconnexa.ovpn
            else
              echo "auth-user-pass vpn-auth.txt" >> cloudconnexa.ovpn
            fi
          else
            echo "No VPN username/password secrets supplied. Assuming profile has embedded certificates/auth."
          fi

      - name: Show IP before VPN
        run: |
          echo "Public IP before VPN:"
          curl -s https://ifconfig.me || true
          echo ""

      - name: Start OpenVPN
        run: |
          sudo openvpn \
            --config cloudconnexa.ovpn \
            --daemon \
            --log openvpn.log \
            --writepid openvpn.pid

          echo "Waiting for VPN tunnel..."
          sleep 25

          echo "OpenVPN log tail:"
          sudo tail -n 120 openvpn.log || true

      - name: Show routing and IP after VPN
        run: |
          echo "Routes:"
          ip route || true

          echo ""
          echo "Public IP after VPN:"
          curl -s https://ifconfig.me || true
          echo ""

          echo ""
          echo "Cloudflare trace:"
          curl -s https://www.cloudflare.com/cdn-cgi/trace || true

      - name: Test Jio channel API
        run: |
          cat > test-jio-api.mjs <<'NODE'
          const url = "https://jiotv.data.cdn.jio.com/apis/v3.0/getMobileChannelList/get/?os=android&devicetype=phone&usertype=tvYR7NSNn7rymo3F";

          const response = await fetch(url, {
            headers: {
              "user-agent": "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36",
              "accept": "application/json,text/plain,*/*"
            }
          });

          console.log("status:", response.status);

          const text = await response.text();
          console.log(text.slice(0, 700));

          if (!response.ok) {
            process.exit(1);
          }
          NODE

          node test-jio-api.mjs

      - name: Run Jio generator limited test
        env:
          JIO_LIMIT: "20"
          JIO_START_OFFSET: "0"
          JIO_END_OFFSET: "0"
          JIO_ALLOW_EMPTY: "0"
          JIO_STRICT: "1"
        run: npm run jio

      - name: Show generated output summary
        if: always()
        run: |
          echo "Output files:"
          ls -lh output || true

          echo ""
          echo "Jio summary:"
          cat output/jio_epg.json 2>/dev/null || true

          echo ""
          echo "Programme count:"
          grep -c "<programme" output/jio_epg.xml 2>/dev/null || true

      - name: Upload VPN test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jio-openvpn-cloudconnexa-test
          path: |
            openvpn.log
            output/jio_channels.json
            output/jio_epg.json
            output/jio_epg.jsonl
            output/jio_epg.xml
            output/jio_epg_stats.json
          if-no-files-found: ignore
