name: Test JioTV with OpenVPN CloudConnexa

on:
  workflow_dispatch:
  push:
    branches:
      - test/jio-vpn-github-runner

permissions:
  contents: read

jobs:
  test-jio-openvpn:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install OpenVPN tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn curl iproute2 dnsutils

      - name: Write OpenVPN config from secret
        env:
          VPN_CONFIG: ${{ secrets.FREE_VPN_CONFIG }}
        run: |
          if [ -z "$VPN_CONFIG" ]; then
            echo "FREE_VPN_CONFIG secret is missing"
            exit 1
          fi

          printf '%s\n' "$VPN_CONFIG" > cloudconnexa.ovpn
          sed -i 's/\r$//' cloudconnexa.ovpn
          chmod 600 cloudconnexa.ovpn

          echo "VPN config loaded."
          echo "Visible non-sensitive config lines:"
          grep -E "^(client|dev|proto|remote|setenv|cipher|auth|remote-cert-tls)" cloudconnexa.ovpn || true

      - name: Patch OpenVPN config for safe split routing
        run: |
          # Remove full-tunnel directives if they exist in the uploaded secret.
          # Full tunnel can break GitHub runner control/log traffic.
          sed -i '/^redirect-gateway/d' cloudconnexa.ovpn
          sed -i '/^route-metric/d' cloudconnexa.ovpn

          # Do not accept server-pushed routes.
          echo "" >> cloudconnexa.ovpn
          echo "route-nopull" >> cloudconnexa.ovpn
          echo "pull-filter ignore redirect-gateway" >> cloudconnexa.ovpn
          echo "auth-nocache" >> cloudconnexa.ovpn
          echo "verb 4" >> cloudconnexa.ovpn

          echo "Final route-related OpenVPN config:"
          grep -E "^(remote|proto|dev|route-nopull|pull-filter|route |redirect-gateway|route-metric|verb)" cloudconnexa.ovpn || true

      - name: Show public IP before VPN
        run: |
          echo "Public IP before VPN:"
          curl -s https://ifconfig.me || true
          echo ""

          echo "Default route before VPN:"
          ip route | head -20 || true

      - name: Start OpenVPN
        run: |
          sudo openvpn \
            --config cloudconnexa.ovpn \
            --daemon \
            --log openvpn.log \
            --writepid openvpn.pid

          echo "Waiting for VPN tunnel..."

          for i in $(seq 1 90); do
            if sudo grep -q "Initialization Sequence Completed" openvpn.log; then
              echo "VPN connected."
              break
            fi

            if sudo grep -qi "AUTH_FAILED\|TLS Error\|Exiting due to fatal error" openvpn.log; then
              echo "VPN failed."
              sudo cat openvpn.log
              exit 1
            fi

            sleep 1
          done

          echo "OpenVPN log tail:"
          sudo tail -n 120 openvpn.log || true

          if ! sudo grep -q "Initialization Sequence Completed" openvpn.log; then
            echo "VPN did not complete initialization."
            exit 1
          fi

      - name: Route JioTV CDN IPv4 addresses via VPN tunnel
        run: |
          JIO_HOST="jiotv.data.cdn.jio.com"

          TUN_DEV="$(ip -o link show | awk -F': ' '/tun[0-9]/{print $2; exit}')"

          if [ -z "$TUN_DEV" ]; then
            echo "Could not find tun interface"
            ip link
            exit 1
          fi

          echo "Detected VPN interface: $TUN_DEV"

          echo "Resolving JioTV IPv4 addresses..."
          getent ahostsv4 "$JIO_HOST" | awk '{print $1}' | sort -u > jio-ips.txt

          if [ ! -s jio-ips.txt ]; then
            echo "Could not resolve JioTV IPv4 addresses"
            exit 1
          fi

          echo "Resolved JioTV IPs:"
          cat jio-ips.txt

          while read -r ip; do
            echo "Routing $ip via $TUN_DEV"
            sudo ip route replace "$ip/32" dev "$TUN_DEV"
          done < jio-ips.txt

          echo "Route checks:"
          while read -r ip; do
            ip route get "$ip" || true
          done < jio-ips.txt

      - name: Show routing after VPN
        run: |
          echo "Default route after VPN:"
          ip route | head -30 || true

          echo ""
          echo "Public IP may still show GitHub IP because only JioTV IPs are routed via VPN:"
          curl -s https://ifconfig.me || true
          echo ""

          echo ""
          echo "Cloudflare trace:"
          curl -s https://www.cloudflare.com/cdn-cgi/trace || true
          echo ""

      - name: Test Jio channel API using curl
        run: |
          URL="https://jiotv.data.cdn.jio.com/apis/v3.0/getMobileChannelList/get/?os=android&devicetype=phone&usertype=tvYR7NSNn7rymo3F"

          echo "Testing JioTV channel API with curl..."
          curl -4 -v \
            --connect-timeout 20 \
            --max-time 45 \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36" \
            -H "Accept: application/json,text/plain,*/*" \
            "$URL" \
            -o jio-response.txt

          echo ""
          echo "First 700 chars of response:"
          head -c 700 jio-response.txt || true
          echo ""

      - name: Create Jio API Node test script
        run: |
          cat > test-jio-api.mjs <<'NODE'
          import dns from "node:dns";

          dns.setDefaultResultOrder("ipv4first");

          const url = "https://jiotv.data.cdn.jio.com/apis/v3.0/getMobileChannelList/get/?os=android&devicetype=phone&usertype=tvYR7NSNn7rymo3F";

          const response = await fetch(url, {
            headers: {
              "user-agent": "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36",
              "accept": "application/json,text/plain,*/*"
            }
          });

          console.log("status:", response.status);

          const text = await response.text();
          console.log(text.slice(0, 700));

          if (!response.ok) {
            process.exit(1);
          }
          NODE

      - name: Test Jio channel API using Node
        run: node test-jio-api.mjs

      - name: Run Jio generator limited test
        env:
          JIO_LIMIT: "20"
          JIO_START_OFFSET: "0"
          JIO_END_OFFSET: "0"
          JIO_ALLOW_EMPTY: "0"
          JIO_STRICT: "1"
        run: npm run jio

      - name: Show generated Jio output summary
        if: always()
        run: |
          echo "Output files:"
          ls -lh output || true

          echo ""
          echo "Jio summary:"
          cat output/jio_epg.json 2>/dev/null || true

          echo ""
          echo "Jio XMLTV programme count:"
          grep -c "<programme" output/jio_epg.xml 2>/dev/null || true

      - name: Upload VPN test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jio-openvpn-cloudconnexa-test
          path: |
            openvpn.log
            jio-ips.txt
            jio-response.txt
            output/jio_channels.json
            output/jio_epg.json
            output/jio_epg.jsonl
            output/jio_epg.xml
            output/jio_epg_stats.json
          if-no-files-found: ignore
